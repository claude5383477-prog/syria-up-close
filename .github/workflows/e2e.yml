# End-to-end tests (Playwright) on GitHub, for when they cannot run locally.
# Hermetic like `npm run test:e2e`: a throwaway embedded Postgres, migrations, the seed and a production
# build (scripts/e2e-server.mjs). It never touches Neon, Vercel or Blob, and needs no secrets.
name: e2e

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # `github` reporter: each failure becomes an annotation, readable on the run page and through the
      # public checks API without signing in (job logs need a GitHub account).
      - run: npm run test:e2e -- --reporter=list,github
        env:
          CI: '1'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
