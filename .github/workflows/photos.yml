# Copies the owner's permitted photo collection (sv-*) from X into public/guide, adds free Commons photos
# for the countryside (seed-content/photo-requests.json), and commits the result to main, which
# redeploys the site. Run by hand: Actions → "photos" → Run workflow.
name: photos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run photos:localize
      - run: npm run photos:fill
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/guide src/content/photos.json seed-content/PHOTOS-REPORT.md
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "صور: نسخ مجموعة سوريا عن قرب إلى الموقع وصور كومنز للأرياف"
          git push
