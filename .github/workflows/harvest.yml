name: photo-harvest
on:
  push:
    branches: [harvest]
permissions:
  contents: write
concurrency: harvest
jobs:
  harvest:
    if: ${{ !contains(github.event.head_commit.message, '[results]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -q pillow
      - if: ${{ !contains(github.event.head_commit.message, '[places]') }}
        run: node scripts/harvest/harvest.mjs && python3 scripts/harvest/sheets.py cities
      - if: ${{ contains(github.event.head_commit.message, '[places]') }}
        run: node scripts/harvest/places.mjs && python3 scripts/harvest/sheets.py places
      - name: commit results
        if: always()
        run: |
          git config user.name "harvest-bot"
          git config user.email "noreply@github.com"
          git add -f harvest
          git commit -qm "[results] harvest output" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin harvest && git push -q origin HEAD:harvest && break; sleep 5; done
