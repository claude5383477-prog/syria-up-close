name: photo-harvest
on:
  push:
    branches: [harvest]
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y imagemagick jq >/dev/null
      - if: ${{ !contains(github.event.head_commit.message, '[places]') }}
        run: node scripts/harvest/harvest.mjs && bash scripts/harvest/sheets.sh
      - if: ${{ contains(github.event.head_commit.message, '[places]') }}
        run: node scripts/harvest/places.mjs && python3 scripts/harvest/sheets_places.py
      - uses: actions/upload-artifact@v4
        with:
          name: harvest
          path: |
            harvest/*.json
            harvest/*.txt
            harvest/sheets/*.jpg
